    <form action="process.php" method="POST">
      <label for="name">Ваше имя *</label>

      <label for="subject">Тема обращения</label>
      <input type="text" id="subject" name="subject" placeholder="Заказ полуфабрикатов">

      <label for="message">Текст сообщения *</label>
      <textarea id="message" name="message" rows="4" required placeholder="Укажите позиции и количество..."></textarea>

      <button type="submit">Отправить обращение</button>
    </form>
